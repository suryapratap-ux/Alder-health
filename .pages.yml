# Pages CMS configuration — https://pagescms.org
#
# Describes the content files in src/content/ so they can be edited at
# app.pagescms.org without touching the code. Field names here must match the
# JSON keys exactly; the Astro templates read those same keys.
#
# Adding a field here makes it editable, but the template still has to render
# it. Renaming or removing one will break the page that reads it.

media:
  - name: images
    label: Photographs
    input: public/images
    output: /images
    categories: [image]
    rename: safe

  - name: icons
    label: Icons
    input: public/icons
    output: /icons
    extensions: [svg]
    rename: safe

# Reusable field groups, so the same shape is defined once.
components:
  seo:
    type: object
    label: Search & social
    fields:
      - name: title
        label: Browser title
        type: string
        required: true
        description: >-
          Shown in the browser tab and as the blue headline in Google results.
          Keep it under about 60 characters or it gets cut off.
      - name: description
        label: Meta description
        type: text
        required: true
        description: >-
          The grey summary under the headline in search results, and the
          preview when the page is shared. Aim for 120–160 characters.
        options:
          minlength: 50
          maxlength: 200

  link:
    type: object
    label: Link
    fields:
      - name: label
        label: Text
        type: string
        required: true
      - name: href
        label: Goes to
        type: string
        required: true
        description: 'A path on this site, such as /find-a-doctor, or an anchor such as #services.'

  photo:
    type: object
    label: Photograph
    fields:
      - name: src
        label: Image
        type: image
        required: true
        options:
          media: images
      - name: alt
        label: Alt text
        type: text
        required: true
        description: >-
          Describes the picture for people using a screen reader, and shows if
          the image fails to load. Describe what is in it, not "photo of".

