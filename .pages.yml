  # -------------------------------------------------------------- Content --
  - name: content
    label: Content
    type: group
    items:
      - name: clinicians
        label: Clinicians
        type: collection
        path: src/content/clinicians
        format: json
        filename: '{primary}.json'
        view:
          primary: name
          fields: [name, specialty, clinic]
          sort: [order, name]
          default:
            sort: order
            order: asc
        fields:
          - name: name
            label: Full name
            type: string
            required: true
            description: >-
              The file name becomes the web address, so Emma Reed is at
              /doctors/emma-reed. Renaming changes that address.
          - name: order
            label: Order
            type: number
            required: true
            description: Lower numbers appear first in the directory and on the home page.
          - name: specialty
            label: Specialty
            type: string
            required: true
          - name: clinic
            label: Clinic
            type: string
            required: true
          - name: clinicAddress
            label: Clinic address
            type: string
          - name: note
            label: Card note
            type: string
            description: The small grey line under the clinic name on cards.
          - name: languages
            label: Languages (short)
            type: string
            description: 'Shown on cards, e.g. English, Spanish.'
          - name: languagesSentence
            label: Languages (sentence)
            type: string
            description: 'Shown on the profile page, e.g. Languages: English and Spanish.'
          - name: credentials
            label: Credentials
            type: string
          - name: formats
            label: Visit formats
            type: string
          - name: nextVisit
            label: Next example visit
            type: string
          - name: visitLength
            label: Visit length
            type: string

          - name: photo
            label: Portrait
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Portrait alt text
            type: text
            required: true
          - name: photoFocus
            label: Portrait focal point
            type: string
            required: true
            pattern:
              regex: '^\d{1,3}% \d{1,3}%$'
              message: 'Use two percentages, across then down, such as 52% 20%.'
            description: >-
              Where the face sits in the picture, across then down. The portrait
              is cropped to different shapes around the site and this keeps the
              face in frame. 50% 20% means centred across, near the top.
          - name: photoWidth
            label: Portrait width in pixels
            type: number
            required: true
            description: Update this if you replace the portrait with a different size.
          - name: photoHeight
            label: Portrait height in pixels
            type: number
            required: true

          - name: profile
            label: Profile page
            type: object
            fields:
              - name: headline
                label: Headline
                type: string
                required: true
              - name: quote
                label: Quote
                type: text
                description: Include the quotation marks you want to appear.
              - name: paragraphs
                label: Paragraphs
                type: text
                list: true
              - name: areasIntro
                label: Areas introduction
                type: text
              - name: areas
                label: Areas of focus
                type: string
                list: true
              - name: inPersonHeading
                label: In-person heading
                type: string
              - name: inPerson
                label: In-person details
                type: text
              - name: video
                label: Video visit details
                type: text
              - name: whatToBring
                label: What to bring
                type: text

      - name: faqs
        label: Questions
        type: collection
        path: src/content/faqs
        format: json
        filename: '{primary}.json'
        view:
          primary: question
          fields: [question, order]
          sort: [order, question]
          default:
            sort: order
            order: asc
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
          - name: order
            label: Order
            type: number
            required: true
            description: Lower numbers appear first.
          - name: open
            label: Open by default
            type: boolean
            description: >-
              The accordion shows one answer at a time, so tick this on one
              question only.

      - name: guides
        label: Guides
        type: collection
        path: src/content/guides
        format: json
        filename: '{primary}.json'
        view:
          primary: title
          fields: [title, kicker, order]
          sort: [order, title]
          default:
            sort: order
            order: asc
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: kicker
            label: Kicker
            type: string
            description: 'The small line above the title, e.g. Visit guide · 4 min read.'
          - name: copy
            label: Description
            type: text
            required: true
          - name: order
            label: Order
            type: number
            required: true
            description: Lower numbers appear first.
          - name: photo
            label: Cover image
            type: image
            required: true
            options:
              media: images
          - name: photoFocus
            label: Cover focal point
            type: string
            required: true
            pattern:
              regex: '^\d{1,3}% \d{1,3}%$'
              message: 'Use two percentages, across then down, such as 50% 70%.'
            description: >-
              Where the subject sits in the picture, across then down. The card
              crops to a wide strip, so this keeps the subject in it.
          - name: alt
            label: Cover alt text
            type: text
            required: true

